function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = 'status ' + type; el.style.display = 'block';
}

async function loadInv() {
  const btn = document.getElementById('btn-inv');
  btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Loading 585 records…';
  setStatus('Sending all 585 inventory records in one call…', 'info');
  try {
    const res = await fetch(API, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'saveInventoryBulk', data: INV})
    });
    const d = await res.json();
    if(res.ok && d.success) {
      setStatus('✓ ' + d.count + ' inventory records loaded successfully!', 'ok');
      btn.innerHTML = '✓ Done — ' + d.count + ' records';
    } else {
      setStatus('Error: ' + (d.error || JSON.stringify(d)), 'err');
      btn.disabled = false; btn.innerHTML = '↻ Retry Inventory';
    }
  } catch(e) {
    setStatus('Failed: ' + e.message, 'err');
    btn.disabled = false; btn.innerHTML = '↻ Retry Inventory';
  }
}
