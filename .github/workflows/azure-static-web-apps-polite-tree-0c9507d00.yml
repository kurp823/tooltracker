name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # ── Build frontend ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        # Produces dist/ which the SWA action will upload as the static site

      # ── Install API packages explicitly ─────────────────────────────────────
      # Oryx (the Azure build engine) requires package-lock.json to run
      # npm ci reliably.  Without it, packages may be silently skipped and
      # the Azure Function host crashes at startup with a 500/Content-Length:0.
      # We pre-install here and set skip_api_build:true so the exact same
      # node_modules directory is deployed without Oryx interference.
      - name: Install API dependencies
        run: npm install --production --prefix api

      # ── Deploy to Azure Static Web Apps ─────────────────────────────────────
      # NOTE: SQL credentials are NOT in this file.
      # Set them in Azure Portal → Static Web Apps → polite-tree-0c9507d00
      #   → Configuration → Application settings
      # They live entirely within Azure — GitHub never sees them.
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_TREE_0C9507D00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          skip_app_build: true   # we already built dist/ above
          skip_api_build: true   # we already ran npm install in api/ above

  pr_build_check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: PR Build Check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_TREE_0C9507D00 }}
          action: "close"
