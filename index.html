  const cal=state.callouts.find(c=>c.id===job.calloutId);
  const assigned=cal?cal.items.filter(i=>i.serialNos&&i.serialNos.length>0):[];
  const shown=new Set();
  const tools_=document.getElementById('dt-tools');if(!tools_)return;

  let assignedRows='';
  assigned.forEach(item=>{
    (item.serialNos||[]).forEach(sn_=>{
      const t=state.inventory.find(x=>x.serial===sn_);if(!t)return;
      // Critical: skip a serial that's already been physically dispatched
      // (by this job or a DIFFERENT job off the same callout) — otherwise
      // the same physical tool can be offered and dispatched twice.
      // "Assigned to Callout" is the normal pre-dispatch reservation state
      // and should still be offered here; only "On Rig" means it's gone.
      if(isOnRig(t))return;
      if(shown.has(t.id))return; // same serial listed twice in this callout's items -- only show it once
      shown.add(t.id);
      assignedRows+=dtToolRow(t,false);
    });
  });

  let html='';
  if(assignedRows){
    html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grn-d);margin-bottom:6px">Assigned to ${cal?esc(cal.id):'this callout'} — tick which tools are actually going out in this dispatch</div>
    <div class="tbl-wrap" style="margin-bottom:12px"><table class="tbl tbl-xs"><thead><tr>
      <th><input type="checkbox" onchange="dtAll(this)"></th>
      <th>Serial</th><th>Size</th><th>Tool Type</th><th>Description</th><th>Ownership</th>
    </tr></thead><tbody>${assignedRows}</tbody></table></div>`;
  } else {
    const hadAssignments=assigned.some(i=>(i.serialNos||[]).length>0);
    const msg=hadAssignments
      ?'This callout\'s assigned tool(s) have already been dispatched on another job — nothing left to dispatch here. Use "+ Add a tool not in this callout" below if this job genuinely needs more.'
      :'Go to Callout Management → Assign Serials first, or add tools manually below.';
    html+=`<div class="empty" style="padding:16px"><div class="empty-title" style="font-size:12px">No serials available to dispatch from this callout</div><div class="empty-sub" style="font-size:11px">${msg}</div></div>`;
  }

  // Anything else in base stock is reachable ONLY through an explicit,
  // search-filtered "add extra" step — never dumped inline. Dispatching
  // the wrong physical tool to a rig is a real, costly mistake, so the
  // default view only ever shows what was actually assigned to this callout.
  html+=`<div style="margin-top:10px">
    <button class="btn btn-secondary btn-sm" id="dt-extra-toggle" onclick="toggleDTExtra()">+ Add a tool not in this callout</button>
    <div id="dt-extra-wrap" style="display:none;margin-top:8px">
      <input class="inp inp-sm" id="dt-extra-search" placeholder="🔍 Search serial, description, size..." oninput="renderDTExtra()" style="width:100%;margin-bottom:8px">
      <div id="dt-extra-list"></div>
    </div>
  </div>`;

  tools_.innerHTML=html;
  window._dtShownIds=shown;
  updateDTCnt();
}
function toggleDTExtra(){
  const w=document.getElementById('dt-extra-wrap');if(!w)return;
  const willShow=w.style.display==='none';
  w.style.display=willShow?'':'none';
  if(willShow)renderDTExtra();
}
function renderDTExtra(){
  const q=(document.getElementById('dt-extra-search')||{}).value||'';
  const shown=window._dtShownIds||new Set();
  const base=state.inventory.filter(t=>isGoodStatus(t)&&isAtBase(t)&&!shown.has(t.id));
  const ql=q.trim().toLowerCase();
  const list=document.getElementById('dt-extra-list');if(!list)return;
  if(!ql){list.innerHTML=`<div style="font-size:11px;color:var(--s400);padding:8px 0">Type to search the rest of base inventory (${base.length} tools available) — nothing is shown until you search, so you can't dispatch the wrong tool by mistake.</div>`;return;}
  const filtered=base.filter(t=>(t.serial+t.shortDesc+t.desc+t.size).toLowerCase().includes(ql));
  if(!filtered.length){list.innerHTML=`<div style="font-size:11px;color:var(--s400);padding:8px 0">No matches</div>`;return;}

function confirmNewDT(){
  const jobId=document.getElementById('dt-job').value;
  const dtNum=document.getElementById('dt-num').value.trim();
  const rm=document.getElementById('dt-rm').value.trim();
  const dtDate=document.getElementById('dt-dt').value||TODAY;
  const rec=document.getElementById('dt-rec').value.trim();
  const by=document.getElementById('dt-by').value.trim()||CU.name;
  const notes=document.getElementById('dt-notes').value.trim();
  if(!jobId){toast('Select a Job','err');return;}
  if(!rm){toast('RM / Callout Ref required','err');return;}
  if(!dtNum){toast('DT Number required','err');return;}
  if(state.dtBatches.some(b=>normStr(b.dtNumber).toLowerCase()===normStr(dtNum).toLowerCase())){
    toast(`DT Number "${dtNum}" is already used by another batch — enter a unique number`,'err');return;
  }
  const job=state.jobs.find(j=>j.id===jobId);if(!job)return;
  const checked=[...document.querySelectorAll('.dt-ck:checked')];
  if(!checked.length){toast('Select at least one tool','err');return;}
  const lines=[];
  const seenSerials=new Set();
  const touchedCallouts=new Set();
  checked.forEach(cb=>{
    const t=state.inventory.find(x=>x.id===cb.dataset.id);if(!t)return;
    if(seenSerials.has(t.serial))return; // same serial checked twice -- only dispatch it once
    seenSerials.add(t.serial);
    lines.push({serial:t.serial,assetNo:t.assetNo,shortDesc:t.shortDesc,desc:t.desc,size:t.size,status:'OnRig',rtBatchId:null,used:null,ownership:t.ownership,isEmdad:t.isEmdad});
    t.location='On Rig';t.rig=job.rig;t.well=job.well;t.contract=job.contract;
    if(job.calloutId){const cal=state.callouts.find(c=>c.id===job.calloutId);if(cal){cal.items.forEach(i=>{if((i.serialNos||[]).includes(t.serial))i.status='Released';});touchedCallouts.add(cal);}}
    logMov(t.serial,'DT Dispatch','Emdad Base','On Rig',dtNum);
    apiUpdateTool(t);
  });
  const batch={id:'DTB-'+Date.now(),dtNumber:dtNum,jobId,rmDate:dtDate,rmRef:rm,dispatchDate:dtDate,rig:job.rig,well:job.well,contract:job.contract,dispatchedBy:by,recipient:rec,notes,toolLines:lines};
  state.dtBatches.push(batch);
  if(job.status==='Open')job.status='Ongoing';
  save();toast(`DT ${dtNum} — ${lines.length} tools dispatched to ${job.rig}`,'ok');closeModal('m-newdt');renderModule('delivery');
  apiSaveDTBatch(batch);
  apiSaveJob(job);
  touchedCallouts.forEach(cal=>apiSaveCallout(cal));
}

let RU={};

let RTLISTQ='',RTLISTSORT='asc',RTLISTSORTBY='rtnum';
function reRTGroups(){const el=document.getElementById('rt-groups');if(el)el.innerHTML=renderRTGroups();}
function toggleRTSort(){RTSORT=RTSORT==='desc'?'asc':'desc';reRTGroups();}
function rtNumSeq(rtNumber){const m=(rtNumber||'').match(/(\d+)\s*$/);return m?parseInt(m[1],10):0;}
function reRTList(){const el=document.getElementById('rt-list-wrap');if(el)el.innerHTML=renderRTList();}
function toggleRTListSort(by){
  if(RTLISTSORTBY===by){RTLISTSORT=RTLISTSORT==='desc'?'asc':'desc';}
  else{RTLISTSORTBY=by;RTLISTSORT=by==='rtnum'?'asc':'desc';}
  reRTList();
}
function renderRTList(){
  let rts=state.rtBatches.slice();
  const q=(RTLISTQ||'').toLowerCase();
  if(q)rts=rts.filter(b=>[b.rtNumber,b.jobId,b.rig,b.well,b.contract,b.receivedBy].join(' ').toLowerCase().includes(q));
  rts.sort((a,b)=>{
    let diff;
    if(RTLISTSORTBY==='rtnum')diff=rtNumSeq(a.rtNumber)-rtNumSeq(b.rtNumber);
    else diff=new Date(a.rtDate||0).getTime()-new Date(b.rtDate||0).getTime();
    return RTLISTSORT==='desc'?-diff:diff;
  });
  if(!rts.length)return`<div class="empty"><div class="empty-ico">📄</div><div class="empty-title">No receiving tickets ${RTLISTQ?'match your search':'yet'}</div></div>`;
  const arrow=(by)=>RTLISTSORTBY===by?(RTLISTSORT==='desc'?'▼':'▲'):'';
  return `<div class="tbl-wrap"><table class="tbl tbl-xs">

function buildRTGroups(){
  const rigMap={};
  state.dtBatches.forEach(b=>{
    b.toolLines.forEach(tl=>{
      if(tl.status!=='OnRig')return;
      const k=b.rig+'|||'+b.well+'|||'+b.contract;
      if(!rigMap[k])rigMap[k]={rig:b.rig,well:b.well,contract:b.contract,tools:[],hist:[]};
      rigMap[k].tools.push({serial:tl.serial,assetNo:tl.assetNo,shortDesc:tl.shortDesc,size:tl.size,ownership:tl.ownership,isEmdad:tl.isEmdad,dtNumber:b.dtNumber,dtDate:b.rmDate,dtBatchId:b.id,jobId:b.jobId,tl});
    });
  });
  state.rtBatches.forEach(rb=>{const k=rb.rig+'|||'+rb.well+'|||'+rb.contract;if(rigMap[k])rigMap[k].hist.push(rb);});
  return Object.values(rigMap).filter(g=>g.tools.length||g.hist.length);
}

        <button class="btn btn-primary" onclick="confirmRT('${gkeyEnc}')">✓ Confirm Return</button>
      </div>

  </div>`);openModal('m-crt');window._rtT=tools;window._rtG={rig,well,contract,isAON};
}

function confirmRT(){
  const rtNum=(document.getElementById('rt-num')||{}).value||nxtRT();
  if(state.rtBatches.some(b=>normStr(b.rtNumber).toLowerCase()===normStr(rtNum).toLowerCase())){
    toast(`RT Number "${rtNum}" is already used by another batch — enter a unique number`,'err');return;
  }
  const rtDate=(document.getElementById('rt-dt')||{}).value||TODAY;
  const rmDate=(document.getElementById('rt-rm')||{}).value||rtDate;
  const cond=(document.getElementById('rt-cond')||{}).value||'';
  const tools=window._rtT||[];const grp=window._rtG||{};
  if(!tools.length)return;
  const unset=tools.filter(t=>t.used===null||t.used===undefined);
  if(unset.length){toast('Set Used/Not Used for all tools first','err');return;}
  const lines=tools.map(t=>{
    const inv=state.inventory.find(x=>x.serial===t.serial);
    return{serial:t.serial,assetNo:inv?inv.assetNo:t.serial,shortDesc:inv?inv.shortDesc:'',dtBatchId:t.dtBatchId,used:t.used,routedTo:t.used?'Inspection Bay':'Emdad Base',condition:cond};
  });
  const rb={id:'RTB-'+Date.now(),rtNumber:rtNum,jobId:(tools[0]||{}).jobId||'',rtDate,backloadRmDate:grp.isAON?rmDate:rtDate,contract:grp.contract,rig:grp.rig,well:grp.well,receivedBy:CU.name,toolLines:lines};
  state.rtBatches.push(rb);
  const touchedDTBatches=new Set();
  tools.forEach(t=>{
    state.dtBatches.forEach(b=>{const tl=b.toolLines.find(x=>x.serial===t.serial&&x.status==='OnRig');if(tl){tl.status='Returned';tl.rtBatchId=rb.id;tl.used=t.used;touchedDTBatches.add(b);}});
    const inv=state.inventory.find(x=>x.serial===t.serial);
    if(inv){inv.location=t.used?'Inspection Bay':'Emdad Base';inv.status=t.used?'Inspection':'Good';if(!t.used){inv.rig='';inv.well='';inv.contract='';}apiUpdateTool(inv);}
    logMov(t.serial,'RT Return','On Rig',t.used?'Inspection Bay':'Emdad Base',rtNum);
    if(t.used){
      const insRec={id:nxtINS(),woNumber:nxtWOI(),serial:t.serial,assetNo:inv?inv.assetNo:'',shortDesc:inv?inv.shortDesc:'',size:inv?inv.size:'',fromRtId:rb.id,rtNumber:rtNum,receivedDate:rtDate,inspector:'',inspectionDate:null,status:'Pending',reportNumber:'',disposition:'',notes:''};
      state.inspections.push(insRec);
      apiSaveInspection(insRec);
    }
  });
  toast(`RT ${rtNum} — ${tools.length} tools received`,'ok');closeModal('m-crt');RU={};
  apiSaveRTBatch(rb);
  touchedDTBatches.forEach(b=>apiSaveDTBatch(b));
  save();renderModule('returns');
}

function switchIT(f,btn){
  document.querySelectorAll('#ins-tabs .mod-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');

  else if(f==='fail')items=items.filter(i=>i.status==='Fail');

  ins.status=document.getElementById('ii-res').value;
  ins.disposition=document.getElementById('ii-dsp').value;
  ins.reportNumber=document.getElementById('ii-rpt').value;
  ins.notes=document.getElementById('ii-nt').value;
  const t=state.inventory.find(x=>x.serial===ins.serial);
  if(t){
    if(ins.status==='Pass'){t.status='Good';t.location='Emdad Base';logMov(ins.serial,'Inspection Pass','Inspection Bay','Emdad Base',ins.reportNumber);apiUpdateTool(t);}
    else if(ins.status==='Fail'){
      t.status=ins.disposition||'Repair';t.location='Workshop';
      const mid=nxtMNT();
      const mntRec={id:mid,woNumber:nxtWOM(),serial:ins.serial,assetNo:t.assetNo||'',shortDesc:t.shortDesc||'',size:t.size||'',fromInspectionId:ins.id,issue:'Failed inspection — '+(ins.disposition||'Repair'),type:'InHouse',vendor:'',assignedTo:'',startDate:TODAY,estCompleteDate:null,completedDate:null,status:'In Progress',cost:null,notes:ins.notes};
      state.maintenance.push(mntRec);
      logMov(ins.serial,'Inspection Fail','Inspection Bay','Workshop',ins.reportNumber);
      toast('Maintenance WO '+mid+' created automatically','inf');
      apiUpdateTool(t);
      apiSaveMaintenance(mntRec);
    }
  }
  save();toast('Inspection updated','ok');closeModal('m-ins');renderModule('inspection');
  apiSaveInspection(ins);
}

  apiSaveMaintenance(m);

function closeMnt(mntId){
  const m=state.maintenance.find(x=>x.id===mntId);if(!m)return;
  // Critical safety check: never let a tool flip to "Good/Available" while
  // it still has ANOTHER active work order open. Without this, a tool can
  // show as available in Inventory while genuinely still mid-repair under a
  // different WO — exactly the kind of mismatch that could get a tool
  // dispatched while it's still sitting in the workshop.
  const otherActive=state.maintenance.find(x=>x.id!==m.id&&x.serial===m.serial&&['In Progress','Awaiting Parts'].includes(x.status));
  if(otherActive){
    toast(`Cannot move to base — ${otherActive.woNumber} for this same tool is still ${otherActive.status}. Resolve that work order first.`,'err');
    return;
  }
  if(!confirm('Mark complete and return to Emdad Base as Good?'))return;
  m.status='Closed';m.completedDate=TODAY;
  const t=state.inventory.find(x=>x.serial===m.serial);
  if(t){t.status='Good';t.location='Emdad Base';t.rig='';t.well='';t.contract='';apiUpdateTool(t);}
  logMov(m.serial,'Maintenance Complete','Workshop','Emdad Base',m.woNumber);
  save();toast(m.serial+' returned to base as Good','ok');renderModule('maintenance');
  apiSaveMaintenance(m);
}

function fmtMoney(n){return n===null||n===undefined||n===''?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pbgUrgency(dateStr){
  if(!dateStr)return{label:'—',color:'var(--s400)',bg:'transparent'};
  const days=Math.ceil((new Date(dateStr)-new Date(TODAY))/86400000);
  if(days<0)return{label:fd(dateStr)+' (EXPIRED)',color:'#fff',bg:'var(--red)'};
  if(days<=30)return{label:fd(dateStr)+` (${days}d)`,color:'#fff',bg:'var(--red)'};
  if(days<=60)return{label:fd(dateStr)+` (${days}d)`,color:'#7c2d12',bg:'#fed7aa'};
  if(days<=90)return{label:fd(dateStr)+` (${days}d)`,color:'#854d0e',bg:'#fef9c3'};
  return{label:fd(dateStr),color:'var(--grn-d)',bg:'#f0fdf4'};
}
function pageContracts(){
  const cons=state.contracts;
  const q=(CONQ||'').toLowerCase();
  const stF=CONST_||'';
  const fil=cons.filter(c=>{
    if(stF&&c.status!==stF)return false;

    return true;
  });
  const active=cons.filter(c=>c.status==='Active').length;
  const completed=cons.filter(c=>c.status==='Completed').length;
  const pbgByCur={};
  cons.forEach(c=>{if(c.pbgValue){pbgByCur[c.currency]=(pbgByCur[c.currency]||0)+Number(c.pbgValue);}});
  const pbgTotalStr=Object.keys(pbgByCur).length?Object.entries(pbgByCur).map(([cur,v])=>`${fmtMoney(v)} ${cur}`).join(' + '):'—';
  const expiringSoon=cons.filter(c=>{
    if(!c.pbgExpiryDate)return false;
    const days=Math.ceil((new Date(c.pbgExpiryDate)-new Date(TODAY))/86400000);
    return days<=60;
  }).length;

  return `
  <div class="page-hdr">
    <div class="page-hdr-l"><div class="page-bc">Accounts</div><div class="page-title">Contracts</div></div>
    <div class="page-hdr-r">${canWrite('contracts')?`<button class="btn btn-primary" onclick="mNewContract()">+ Add Contract</button>`:''}</div>

  <div class="card" style="padding:12px 16px;margin-bottom:14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="inp inp-sm" placeholder="🔍 Search client, contract ref, PO..." value="${esc(CONQ||'')}" oninput="CONQ=this.value;renderModule('contracts')" style="width:280px">
      <select class="inp inp-sm" onchange="CONST_=this.value;renderModule('contracts')" style="width:150px">
        <option value="">All Status</option>
        ${['Active','Completed','Expired'].map(s=>`<option ${stF===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--s400);margin-left:auto">${fil.length} of ${cons.length} contracts</span>
    </div>
  </div>
  <div class="tbl-wrap"><table class="tbl tbl-xs">
    <thead><tr>
      <th>Client</th><th>Contract Ref</th><th>Status</th><th>Currency</th>
      <th style="text-align:right">Contract Value</th><th style="text-align:right">Invoiced to Date</th>

    <tbody>${fil.map(c=>{
      const hasInvoice=c.invoicedToDate!==null&&c.invoicedToDate!==undefined&&c.invoicedToDate!=='';
      const balance=hasInvoice&&c.contractValue?Number(c.contractValue)-Number(c.invoicedToDate):null;
      const pct=hasInvoice&&c.contractValue?Math.min(100,Math.round(Number(c.invoicedToDate)/Number(c.contractValue)*100)):null;

// ════════════════════════════════════════════════════
// PRICE LIST MAINTENANCE — two tabs:
//   1. Client Contract Rates (tbl_ContractRates) -- what you charge
//   2. Sub-Contractor Rates (tbl_SubContractRates) -- what you pay
// Lets gaps or mistakes get corrected directly instead of needing
// a fresh spreadsheet reload every time.

let TAB_PL='client';
let PL_CLIENT_RATES=null, PL_SUB_RATES=null;
let PLQ='';

function pagePriceLists(){
  if(PL_CLIENT_RATES===null || PL_SUB_RATES===null){
    // Kick off the fetch in the background, show a loading state now,
    // then re-render once real data arrives -- renderModule's dispatch
    // is synchronous, so this page can't be an async function itself.
    Promise.all([
      PL_CLIENT_RATES===null ? API('getcontractratesfull').catch(()=>[]) : Promise.resolve(PL_CLIENT_RATES),
      PL_SUB_RATES===null ? API('getsubcontractrates').catch(()=>[]) : Promise.resolve(PL_SUB_RATES)
    ]).then(([cr,sr])=>{
      PL_CLIENT_RATES=cr; PL_SUB_RATES=sr;
      if(CURRENT_MODULE==='pricelists')renderModule('pricelists');
    });
    return `<div class="empty"><div class="empty-ico">⏳</div><div class="empty-title">Loading price lists…</div></div>`;
  }

  const q=(PLQ||'').toLowerCase();
  const clientFil=(PL_CLIENT_RATES||[]).filter(r=>!q||[r.ContractCode,r.Category,r.HoleSection,r.EMDADShortDesc].join(' ').toLowerCase().includes(q));
  const subFil=(PL_SUB_RATES||[]).filter(r=>!q||[r.Supplier,r.Category].join(' ').toLowerCase().includes(q));

  return `
  <div class="page-hdr">
    <div class="page-hdr-l"><div class="page-bc">Accounts</div><div class="page-title">Price Lists</div></div>
    <div class="page-hdr-r">${canWrite('pricelists')?
      (TAB_PL==='client'
        ?`<button class="btn btn-primary" onclick="mEditRate(null)">+ Add Client Rate</button>`
        :`<button class="btn btn-primary" onclick="mEditSubRate(null)">+ Add Sub-Contractor Rate</button>`)
      :''}</div>
  </div>
  <div class="card" style="padding:0;margin-bottom:14px;overflow:hidden">
    <div class="mod-tabs" style="padding:8px 12px 0">
      <button class="mod-tab${TAB_PL==='client'?' active':''}" onclick="TAB_PL='client';renderModule('pricelists')">Client Contract Rates (${(PL_CLIENT_RATES||[]).length})</button>
      <button class="mod-tab${TAB_PL==='sub'?' active':''}" onclick="TAB_PL='sub';renderModule('pricelists')">Sub-Contractor Rates (${(PL_SUB_RATES||[]).length})</button>
    </div>
  </div>
  <div class="card" style="padding:12px 16px;margin-bottom:14px">
    <input class="inp inp-sm" placeholder="🔍 Search ${TAB_PL==='client'?'contract, category, hole section...':'supplier, category...'}" value="${esc(PLQ)}"
      oninput="PLQ=this.value;renderModule('pricelists')" style="width:320px">
  </div>
  ${TAB_PL==='client'?renderClientRatesTable(clientFil):renderSubRatesTable(subFil)}
  `;
}

async function saveClientRate(rateId){
  const btn=document.getElementById('rt-save-btn');
  if(btn.disabled)return;
  const rate={
    rateId: rateId||undefined,
    contractCode: document.getElementById('rt-cc').value.trim(),
    contractName: document.getElementById('rt-cn').value.trim(),
    category: document.getElementById('rt-cat').value.trim(),
    holeSection: document.getElementById('rt-hs').value.trim(),
    size: document.getElementById('rt-sz').value.trim()||null,
    opsRate: document.getElementById('rt-or').value?Number(document.getElementById('rt-or').value):null,
    standbyRate: document.getElementById('rt-sr').value?Number(document.getElementById('rt-sr').value):null,
    runCharges: document.getElementById('rt-rc').value?Number(document.getElementById('rt-rc').value):null,
    redress: document.getElementById('rt-rd').value?Number(document.getElementById('rt-rd').value):null,
    currency: document.getElementById('rt-cur').value.trim()||'USD',
    activeFlag: document.getElementById('rt-af').value==='1',
    notes: document.getElementById('rt-notes').value.trim()||null
  };
  if(!rate.contractCode||!rate.category||!rate.holeSection){toast('Contract Code, Category, and Hole Section are required','err');return;}
  btn.disabled=true;btn.textContent='Saving…';
  try{
    await API('savecontractrate',{rate});
    toast('Rate saved','ok');
    closeModal('m-rate');
    PL_CLIENT_RATES=null; // force refetch
    renderModule('pricelists');
  }catch(e){ btn.disabled=false;btn.textContent='Save'; }
}

// ── 2. NON-BLOCKING LOGIN HANDLER (Place at the bottom of the script) ─────
async function doLoginUI(){
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  const errEl = document.getElementById('lerr');
  const btn = document.querySelector('.login-wrap .btn-primary');
  
  if(!u || !p){
    errEl.textContent = 'Please enter username and password';
    errEl.style.display = '';
    return;
  }

  const user = USERS.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pass === p);
  if(!user){
    errEl.textContent = 'Invalid username or password';
    errEl.style.display = '';
    return;
  }

  errEl.style.display = 'none';
  if(btn){ btn.textContent = 'Signing in...'; btn.disabled = true; }

  CU = user;
  sessionStorage.setItem(SK.usr, JSON.stringify({id: user.id, username: user.username}));

  // Instant UI transition to dashboard (Zero Lag)
  const loginPage = document.getElementById('login-page');
  if(loginPage) loginPage.style.display = 'none';
  
  const appContainer = document.getElementById('app');
  if(appContainer) appContainer.style.display = 'flex';

  renderSidebar();
  renderModule('dashboard');

  const localUser = doLogin(u, p);
  if(localUser){
    errEl.style.display = 'none';
    initApp();
    if(btn){ btn.textContent = 'Sign In →'; btn.disabled = false; }
    API('login', {username: u, password: p}).then(apiUser => {
      if(apiUser) CU = {id: apiUser.id, username: apiUser.username, name: apiUser.name, role: apiUser.role};
    }).catch(() => {});
    return;
  }

  if(btn){ btn.textContent = 'Signing in...'; btn.disabled = true; }
  try{
    const apiUser = await API('login', {username: u, password: p});
    if(apiUser){
      CU = {id: apiUser.id, username: apiUser.username, name: apiUser.name, role: apiUser.role};
      sessionStorage.setItem(SK.usr, JSON.stringify({id: CU.id, username: CU.username}));
      errEl.style.display = 'none';
      initApp();
      return;
    }
  } catch(e){}
  
  errEl.textContent = 'Invalid username or password';
  errEl.style.display = '';
  if(btn){ btn.textContent = 'Sign In →'; btn.disabled = false; }
}

function initApp(){
  if(!CU){console.error('initApp: no CU');return;}
  load();
  document.getElementById('login-page').style.display = 'none';
  const jobHubId = new URLSearchParams(location.search).get('jobHub');
  if(jobHubId){
    document.getElementById('app').style.display = 'none';
    document.getElementById('job-hub-root').style.display = '';
    renderJobHubFullPage(jobHubId);
    return;
  }
  document.getElementById('app').style.display = '';
  renderSidebar();
  const d = document.getElementById('tb-date'); if(d) d.textContent = fdL(TODAY);
  const mod = getModule();
  renderModule(canAccess(mod) ? mod : 'dashboard');
}

(function boot(){
  if(checkAuth() && CU) initApp();
})();
