    function downloadSelfHtml() {
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `EMDAD_Oilfield_ERP_Standalone_${new Date().toISOString().split('T')[0]}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Standalone HTML file downloaded! You can open it in any browser offline.", "📥");
    }

    function showToast(text, icon = "✓") {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-icon').innerText = icon;
      document.getElementById('toast-text').innerText = text;
      box.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      box.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        box.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
        box.classList.remove('opacity-100', 'translate-y-0');
      }, 3500);
    }

    function openToggleInvoiceLockModal(jobId) {
      const job = appState.data.jobs.find(j => j.JobID === jobId);
      if (!job) return;

      if (job.IsInvoiceLocked) {
        // Must provide SOX justification
        openModal(`
          <div class="px-4 py-3 bg-rose-800 text-white flex justify-between items-center">
            <h3 class="font-bold text-sm">SOX Legal Invoice Unlock Authorization: ${jobId}</h3>
            <button onclick="closeModal()" class="text-white hover:text-amber-300 font-bold">&times;</button>
          </div>
          <form onsubmit="handleUnlockInvoice(event, '${jobId}')" class="p-4 space-y-3 text-xs">
            <div class="bg-rose-50 border border-rose-200 rounded p-2.5 text-rose-800">
              <strong>Audit Warning:</strong> This invoice was legally locked under ${job.ERPInvoiceNo}. Any retroactive modification requires a formal business reason logged into the permanent SOX audit trail.
            </div>
            <div>
              <label class="block font-bold mb-1">Audited Justification Reason *</label>
              <textarea id="unlock-reason" required rows="3" class="w-full border rounded px-2.5 py-1.5" placeholder="e.g. ADNOC Dispute Resolution Committee approved 12 hrs weather standby credit..."></textarea>
            </div>
            <div class="pt-3 border-t flex justify-end space-x-2">
              <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded bg-slate-100 text-slate-700 font-bold">Cancel</button>
              <button type="submit" class="px-4 py-1.5 rounded bg-rose-700 text-white font-bold">Authorize SOX Unlock</button>
            </div>
          </form>
        `);
      } else {
        // Lock invoice
        job.IsInvoiceLocked = true;
        job.ERPInvoiceNo = `INV-DXB-${Math.floor(10000 + Math.random() * 90000)}`;
        appState.data.unlockAudits.push({
          AuditID: `AUD-00${appState.data.unlockAudits.length + 1}`,
          JobID: jobId,
          InvoiceNo: job.ERPInvoiceNo,
          Action: "LOCKED",
          User: appState.currentRole,
          Reason: "Invoice closed and submitted to client ERP.",
          Timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
        });
        saveState();
        showToast(`🔒 Job ${jobId} invoice locked as ${job.ERPInvoiceNo}`);
        renderCurrentView();
      }
    }

    function handleUnlockInvoice(e, jobId) {
      e.preventDefault();
      const job = appState.data.jobs.find(j => j.JobID === jobId);
      const reason = document.getElementById('unlock-reason').value;
      if (job) {
        job.IsInvoiceLocked = false;
        appState.data.unlockAudits.push({
          AuditID: `AUD-00${appState.data.unlockAudits.length + 1}`,
          JobID: jobId,
          InvoiceNo: job.ERPInvoiceNo || "OPEN",
          Action: "UNLOCKED",
          User: appState.currentRole,
          Reason: reason,
          Timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
        });
        saveState();
        closeModal();
        showToast(`🔓 Authorized invoice unlock for Job ${jobId}`);
        renderCurrentView();
      }
    }

                        gp.PassType === 'Outward' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                      }">${gp.PassType}</span>
                    </td>
                    <td class="px-3 py-2 font-medium">${gp.VehicleNo} <span class="text-slate-400">|</span> ${gp.DriverName}</td>
                    <td class="px-3 py-2 text-slate-800">${gp.Destination}</td>
                    <td class="px-3 py-2 text-slate-600 text-[11px]">${gp.Purpose}</td>
                    <td class="px-3 py-2 font-mono text-[11px]">${gp.IssuedBy} (${gp.IssuedAt})</td>
                    <td class="px-3 py-2 text-center">
                      <button onclick="printGatePassSlip('${gp.PassID}')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 border text-blue-700 font-bold text-[11px]">
                        🖨️ Print Pass
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function printGatePassSlip(passId) {
      const gp = appState.data.gatePasses.find(g => g.PassID === passId);
      if (!gp) return;

      openModal(`
        <div class="p-6 bg-white space-y-4">
          <div class="flex justify-between items-center border-b pb-3">
            <div>
              <h2 class="text-base font-extrabold text-[#1a3055]">EMDAD SECURITY COMMAND</h2>
              <div class="text-xs text-slate-500">Official Facility Gate Authorization Pass</div>
            </div>
            <div class="text-right">
              <div class="font-mono font-bold text-base text-amber-700">${gp.PassID}</div>
              <div class="text-xs text-slate-500">${gp.IssuedAt}</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-3 rounded border">
            <div><strong>Pass Movement:</strong> ${gp.PassType} Pass</div>
            <div><strong>Vehicle Plate No:</strong> ${gp.VehicleNo}</div>
            <div><strong>Driver Name:</strong> ${gp.DriverName}</div>
            <div><strong>Destination / Location:</strong> ${gp.Destination}</div>
          </div>
          <div class="text-xs p-3 bg-white border rounded">
            <strong>Manifest Purpose:</strong> ${gp.Purpose}
          </div>
          <div class="grid grid-cols-2 gap-8 pt-6 text-xs text-slate-600">
            <div class="border-t pt-1">Security Officer Signature: _______________</div>
            <div class="border-t pt-1">Driver Acceptance Signature: _______________</div>
          </div>
          <div class="flex justify-end space-x-2 pt-4 no-print">
            <button onclick="closeModal()" class="px-3 py-1 rounded bg-slate-100 font-bold text-xs">Close</button>
            <button onclick="window.print()" class="px-4 py-1 rounded bg-[#1a3055] text-white font-bold text-xs">Print Pass</button>
          </div>
        </div>
      `);
    }

    // 8. QC INSPECTION BAY
    function renderInspectionView(data, role) {
      return `
        <div class="space-y-4">

              <div class="text-[11px] text-slate-500 font-medium">Quality Assurance & Certification</div>
              <h1 class="text-base font-bold text-[#1a3055]">QC Inspection Bay & API NDT Work Orders</h1>

          <div class="bg-white border border-[#b8c9db] rounded overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs border-collapse">
              <thead class="bg-slate-50 text-[#24476b] border-b border-[#b8c9db] font-bold">
                <tr>
                  <th class="px-3 py-2">INSPECTION ID</th>
                  <th class="px-3 py-2">TOOL SERIAL #</th>
                  <th class="px-3 py-2">METHOD & STANDARD</th>

                </tr>
              </thead>

                    <td class="px-3 py-2 font-mono font-bold text-[#1a3055]">${i.SerialNo}</td>

    // 9. WORKSHOP & REDRESS
    function renderMaintenanceView(data, role) {
      return `
        <div class="space-y-4">
          <div class="bg-white border border-[#b8c9db] rounded p-4 flex items-center justify-between shadow-sm">

              <div class="text-[11px] text-slate-500 font-medium">Workshop Operations</div>
              <h1 class="text-base font-bold text-[#1a3055]">Tool Maintenance, Redress & Overhaul Orders</h1>

    // 10. MASTER CONTRACTS & PBG
    function renderContractsView(data, role) {
      return `
        <div class="space-y-4">
          <div class="bg-white border border-[#b8c9db] rounded p-4 flex items-center justify-between shadow-sm">

              <div class="text-[11px] text-slate-500 font-medium">Commercial & Contractual Compliance</div>

          <div class="bg-white border border-[#b8c9db] rounded overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs border-collapse">
              <thead class="bg-slate-50 text-[#24476b] border-b border-[#b8c9db] font-bold">

                  <th class="px-3 py-2">CONTRACT REF</th>

                ${data.contracts.map(cnt => `

    // 11. UTILIZATION & BILLING MATRIX
    function renderUtilizationView(data, role) {
      return `
        <div class="space-y-4">
          <div class="bg-white border border-[#b8c9db] rounded p-4 flex items-center justify-between shadow-sm">
            <div>
              <div class="text-[11px] text-slate-500 font-medium">Commercial Revenue Engine</div>
              <h1 class="text-base font-bold text-[#1a3055]">Tool Utilization Matrix & Tiered Operating/Standby Billing</h1>
            </div>
          </div>

          <div class="bg-white border border-[#b8c9db] rounded p-4 shadow-sm space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div class="p-3 bg-slate-50 rounded border">
                <div class="text-xs text-slate-500 font-medium">Standard Operating Day Rate</div>

              </div>
            </div>
          </div>
        </div>
      `;

    // 12. JOB P&L & COSTING HUB
    function renderJobHubView(data, role) {
      const totalRev = data.jobs.reduce((s, j) => s + (j.InvoicedAmountUSD || 0), 0);
      const totalCosts = data.jobCosts.reduce((s, c) => s + (c.AmountUSD || 0), 0);
      const grossMargin = totalRev - totalCosts;
      const marginPct = totalRev > 0 ? (grossMargin / totalRev) * 100 : 0;

      return `
        <div class="space-y-4">
          <div class="bg-white border border-[#b8c9db] rounded p-4 flex items-center justify-between shadow-sm">
            <div>
              <div class="text-[11px] text-slate-500 font-medium">Financial Controller & Audits</div>
              <h1 class="text-base font-bold text-[#1a3055]">Job Costing, P&L Margins & SOX Legal Unlock Audits</h1>
            </div>
            ${role !== 'Viewer' ? `
              <button onclick="openAddJobCostModal()" class="px-3 py-1.5 rounded bg-[#ffd875] text-[#4a2e00] font-bold text-xs border border-[#c8860d] hover:brightness-105 shadow-sm">
                + Log Direct Job Cost
              </button>
            ` : ''}
          </div>

          <!-- Financial KPIs -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="bg-white border border-[#b8c9db] rounded p-3.5 shadow-sm">
              <div class="text-[11px] text-slate-500">Billed Revenue</div>
              <div class="mt-1 text-2xl font-extrabold font-mono text-emerald-700">$${totalRev.toLocaleString()}</div>
            </div>
            <div class="bg-white border border-[#b8c9db] rounded p-3.5 shadow-sm">
              <div class="text-[11px] text-slate-500">Direct Operating Costs</div>
              <div class="mt-1 text-2xl font-extrabold font-mono text-rose-700">$${totalCosts.toLocaleString()}</div>
            </div>
            <div class="bg-white border border-[#b8c9db] rounded p-3.5 shadow-sm">
              <div class="text-[11px] text-slate-500">Gross Margin ($)</div>
              <div class="mt-1 text-2xl font-extrabold font-mono text-[#1a3055]">$${grossMargin.toLocaleString()}</div>
            </div>
            <div class="bg-white border border-[#b8c9db] rounded p-3.5 shadow-sm">
              <div class="text-[11px] text-slate-500">Gross Margin (%)</div>
              <div class="mt-1 text-2xl font-extrabold font-mono text-emerald-700">${marginPct.toFixed(1)}%</div>
            </div>
          </div>

          <!-- Job Costs Table -->
          <div class="bg-white border border-[#b8c9db] rounded overflow-hidden shadow-sm">
            <div class="px-4 py-2.5 bg-[#dbe6f1] border-b border-[#b8c9db] font-bold text-xs text-[#1a3055] uppercase">
              Direct Cost Vouchers & Expenditures
            </div>
            <table class="w-full text-left text-xs border-collapse">
              <thead class="bg-slate-50 text-[#24476b] border-b border-[#b8c9db] font-bold">
                <tr>
                  <th class="px-3 py-2">JOB ID</th>
                  <th class="px-3 py-2">CATEGORY</th>
                  <th class="px-3 py-2">DESCRIPTION</th>
                  <th class="px-3 py-2">SUPPLIER & PO #</th>
                  <th class="px-3 py-2">DATE</th>
                  <th class="px-3 py-2 text-right">AMOUNT (USD)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#e2e8f0]">
                ${data.jobCosts.map(c => `
                  <tr class="hover:bg-[#e4eef8]">
                    <td class="px-3 py-2 font-mono font-bold text-amber-900">${c.JobID}</td>
                    <td class="px-3 py-2"><span class="px-1.5 py-0.5 rounded bg-slate-100 border text-slate-800 text-[10px] font-bold">${c.CostCategory}</span></td>
                    <td class="px-3 py-2 font-bold text-[#1a3055]">${c.Description}</td>
                    <td class="px-3 py-2 text-slate-800">${c.Supplier} <span class="font-mono text-slate-500">(${c.PONumber})</span></td>
                    <td class="px-3 py-2 font-mono text-slate-600">${c.CostDate}</td>
                    <td class="px-3 py-2 font-mono font-bold text-rose-800 text-right">$${c.AmountUSD.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openAddJobCostModal() {
      openModal(`
        <div class="px-4 py-3 bg-[#5b7fa6] text-white flex justify-between items-center">
          <h3 class="font-bold text-sm">Record Direct Job Cost Voucher</h3>
          <button onclick="closeModal()" class="text-white hover:text-amber-300 font-bold">&times;</button>
        </div>
        <form onsubmit="handleSaveJobCost(event)" class="p-4 space-y-3 text-xs">
          <div>
            <label class="block font-bold mb-1">Target Drilling Job *</label>
            <select id="jc-job" class="w-full border rounded px-2.5 py-1.5 font-bold">
              ${appState.data.jobs.map(j => `<option value="${j.JobID}">${j.JobID} — ${j.Rig} (${j.Client})</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-bold mb-1">Cost Category</label>
              <select id="jc-cat" class="w-full border rounded px-2.5 py-1.5 font-bold">
                <option value="SubCon">Sub-Contractor Tools</option>
                <option value="Transport">Transport & Logistics</option>
                <option value="Workshop">Workshop Redress & Parts</option>
                <option value="Personnel">Field Personnel Day Rate</option>
                <option value="Other">Other Direct Charges</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1">Amount (USD) *</label>
              <input type="number" id="jc-amt" required value="3500" class="w-full border rounded px-2.5 py-1.5 font-mono font-bold" />
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1">Cost Description *</label>
            <input type="text" id="jc-desc" required value="Mobilization heavy crane handling at base" class="w-full border rounded px-2.5 py-1.5" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-bold mb-1">Supplier / Vendor</label>
              <input type="text" id="jc-sup" value="Al Masaood Transport" class="w-full border rounded px-2.5 py-1.5" />
            </div>
            <div>
              <label class="block font-bold mb-1">PO / Voucher #</label>
              <input type="text" id="jc-po" value="PO-EXP-9921" class="w-full border rounded px-2.5 py-1.5 font-mono" />
            </div>
          </div>
          <div class="pt-3 border-t flex justify-end space-x-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded bg-slate-100 text-slate-700 font-bold">Cancel</button>
            <button type="submit" class="px-4 py-1.5 rounded bg-amber-400 text-[#1a3055] font-bold">Save Cost</button>
          </div>
        </form>
      `);
    }

    function handleSaveJobCost(e) {
      e.preventDefault();
      const newCost = {
        CostID: `CST-0${appState.data.jobCosts.length + 1}`,
        JobID: document.getElementById('jc-job').value,
        CostCategory: document.getElementById('jc-cat').value,
        Description: document.getElementById('jc-desc').value,
        Supplier: document.getElementById('jc-sup').value,
        PONumber: document.getElementById('jc-po').value,
        AmountUSD: parseFloat(document.getElementById('jc-amt').value) || 0,
        CostDate: new Date().toISOString().split('T')[0]
      };
      appState.data.jobCosts.unshift(newCost);
      saveState();
      closeModal();
      showToast(`✓ Logged cost of $${newCost.AmountUSD.toLocaleString()}`);
      renderCurrentView();
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
    });
  </script>
</body>
</html>
