let RU={};
let RTQ='',RTSORT='desc';
let RTLISTQ='',RTLISTSORT='asc',RTLISTSORTBY='rtnum';
function reRTGroups(){const el=document.getElementById('rt-groups');if(el)el.innerHTML=renderRTGroups();}
function toggleRTSort(){RTSORT=RTSORT==='desc'?'asc':'desc';reRTGroups();}
function rtNumSeq(rtNumber){const m=(rtNumber||'').match(/(\d+)\s*$/);return m?parseInt(m[1],10):0;}
function reRTList(){const el=document.getElementById('rt-list-wrap');if(el)el.innerHTML=renderRTList();}
function toggleRTListSort(by){
  if(RTLISTSORTBY===by){RTLISTSORT=RTLISTSORT==='desc'?'asc':'desc';}
  else{RTLISTSORTBY=by;RTLISTSORT=by==='rtnum'?'asc':'desc';}
  reRTList();
}
function renderRTList(){
  let rts=state.rtBatches.slice();
  const q=(RTLISTQ||'').toLowerCase();
  if(q)rts=rts.filter(b=>[b.rtNumber,b.jobId,b.rig,b.well,b.contract,b.receivedBy].join(' ').toLowerCase().includes(q));
  rts.sort((a,b)=>{
    let diff;
    if(RTLISTSORTBY==='rtnum')diff=rtNumSeq(a.rtNumber)-rtNumSeq(b.rtNumber);
    else diff=new Date(a.rtDate||0).getTime()-new Date(b.rtDate||0).getTime();
    return RTLISTSORT==='desc'?-diff:diff;
  });
  if(!rts.length)return`<div class="empty"><div class="empty-ico">📄</div><div class="empty-title">No receiving tickets ${RTLISTQ?'match your search':'yet'}</div></div>`;
  const arrow=(by)=>RTLISTSORTBY===by?(RTLISTSORT==='desc'?'▼':'▲'):'';
  return `<div class="tbl-wrap"><table class="tbl tbl-xs">
    <thead><tr>
      <th style="cursor:pointer" onclick="toggleRTListSort('rtnum')">RT Number ${arrow('rtnum')}</th>
      <th>Job</th><th>Rig / Well</th><th>Contract</th>
      <th style="cursor:pointer" onclick="toggleRTListSort('date')">Date ${arrow('date')}</th>
      <th>Tools</th><th>Used</th><th>By</th><th>Actions</th></tr></thead>
    <tbody>${rts.map(b=>{
      const usedCnt=b.toolLines.filter(t=>t.used).length;
      return `<tr>
        <td><span style="font-family:monospace;font-weight:700;color:var(--grn-d)">${esc(b.rtNumber)}</span></td>
        <td><span style="font-family:monospace;font-size:10.5px;color:var(--amber-d)">${esc(b.jobId||'—')}</span></td>
        <td><div style="font-weight:600">${esc(b.rig)}</div><div style="font-size:10px;color:var(--s400)">${esc(b.well)}</div></td>
        <td>${cb(b.contract)}</td>
        <td style="font-size:11px">${fd(b.rtDate)}</td>
        <td style="text-align:center;font-family:monospace;font-weight:700">${b.toolLines.length}</td>
        <td style="text-align:center;font-family:monospace;font-weight:700;color:${usedCnt>0?'var(--amber-d)':'var(--s400)'}">${usedCnt}</td>
        <td style="font-size:11px;color:var(--s500)">${esc(b.receivedBy)}</td>
        <td>
          <button class="btn btn-secondary btn-xs" onclick="mRTDetail('${esc(b.id)}')">View</button>
          <button class="btn btn-ghost btn-xs" onclick="printRT('${esc(b.id)}')">🖨</button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}
function buildRTGroups(){
  const rigMap={};
  state.dtBatches.forEach(b=>{
    b.toolLines.forEach(tl=>{
      if(tl.status!=='OnRig')return;
      const k=b.rig+'|||'+b.well+'|||'+b.contract;
      if(!rigMap[k])rigMap[k]={rig:b.rig,well:b.well,contract:b.contract,tools:[],hist:[]};
      rigMap[k].tools.push({serial:tl.serial,assetNo:tl.assetNo,shortDesc:tl.shortDesc,size:tl.size,ownership:tl.ownership,isEmdad:tl.isEmdad,dtNumber:b.dtNumber,dtDate:b.rmDate,dtBatchId:b.id,jobId:b.jobId,tl});
    });
  });
  state.rtBatches.forEach(rb=>{const k=rb.rig+'|||'+rb.well+'|||'+rb.contract;if(rigMap[k])rigMap[k].hist.push(rb);});
  return Object.values(rigMap).filter(g=>g.tools.length||g.hist.length);
}
function renderRTGroups(){
  let rigs=buildRTGroups();
  const q=(RTQ||'').toLowerCase();
  if(q)rigs=rigs.filter(g=>[g.rig,g.well,g.contract].join(' ').toLowerCase().includes(q));
  rigs.sort((a,b)=>{
    const da=Math.max(0,...a.tools.map(t=>new Date(t.dtDate||0).getTime()),...a.hist.map(h=>new Date(h.rtDate||0).getTime()));
    const db=Math.max(0,...b.tools.map(t=>new Date(t.dtDate||0).getTime()),...b.hist.map(h=>new Date(h.rtDate||0).getTime()));
    return RTSORT==='desc'?db-da:da-db;
  });
  if(!rigs.length)return`<div class="empty"><div class="empty-ico">↩</div><div class="empty-title">No tools on rig ${RTQ?'match your search':''}</div>${!RTQ?'<div class="empty-sub">Tools dispatched via Delivery Tickets will appear here</div>':''}</div>`;
  return rigs.map(g=>{
    const gid='ret-'+encodeURIComponent(g.rig+'|||'+g.well+'|||'+g.contract);
    return `<div class="rig-card">
      <div class="rig-hdr" id="${gid}-h" onclick="toggleRig('${gid}')">
        <span class="rig-chevron" id="${gid}-c">▶</span>
        <span style="font-weight:700;font-size:13px">${esc(g.rig)}</span>
        <span style="color:var(--s400);margin:0 6px">·</span>
        <span style="font-size:12px;color:var(--s600)">${esc(g.well)}</span>
        ${cb(g.contract)}
        <span class="badge bg-onrig">${g.tools.length} On Rig</span>
        ${g.hist.length?`<span class="badge bg-good">${g.hist.reduce((s,r)=>s+r.toolLines.length,0)} Returned</span>`:''}
        <div style="margin-left:auto">
          ${canWrite('returns')&&g.tools.length?`<button class="btn btn-primary btn-xs" onclick="event.stopPropagation();mCreateRT('${gid}')">Create RT →</button>`:''}
        </div>
      </div>
      <div class="rig-body" id="${gid}-b">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--s400);margin-bottom:6px">Tools On Rig — tick to return, mark Used/Not Used</div>
        <div class="tbl-wrap" style="margin-bottom:10px">
          <table class="tbl tbl-xs">
            <thead><tr>
              <th><input type="checkbox" onchange="retAll(this,'${gid}')"></th>
              <th>Serial</th><th>Size</th><th>Tool</th><th>Job</th><th>DT#</th><th>DT Date</th><th>Ownership</th><th>Used?</th>
            </tr></thead>
            <tbody>
              ${g.tools.map(t=>{const sid=encodeURIComponent(t.serial);return `<tr>
                <td><input type="checkbox" class="ret-ck" data-gid="${gid}" data-ser="${esc(t.serial)}" data-dtb="${esc(t.dtBatchId)}" data-job="${esc(t.jobId)}"></td>
                <td>${sn(t.serial,t.isEmdad)}</td>
                <td style="font-family:monospace;font-weight:600">${esc(t.size)}</td>
                <td style="font-weight:500">${esc(t.shortDesc)}</td>
                <td><span style="font-family:monospace;font-size:10.5px;color:var(--amber-d)">${esc(t.jobId||'—')}</span></td>
                <td style="font-family:monospace;font-size:10.5px;color:var(--blue)">${esc(t.dtNumber)}</td>
                <td style="font-size:11px;color:var(--s400)">${fd(t.dtDate)}</td>
                <td>${ob(t.ownership)}</td>
                <td>
                  <div style="display:flex;gap:3px">
                    <button id="ry-${sid}" class="btn btn-ghost btn-xs" onclick="setRU('${esc(t.serial)}',true)" style="font-size:10px">Used</button>
                    <button id="rn-${sid}" class="btn btn-ghost btn-xs" onclick="setRU('${esc(t.serial)}',false)" style="font-size:10px">Not Used</button>
                  </div>
                </td>
              </tr>`;}).join('')}
            </tbody>
          </table>
        </div>
        ${g.hist.length?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--grn-d);margin-bottom:6px">RT History</div>
        <div class="tbl-wrap"><table class="tbl tbl-xs">
          <thead><tr><th>RT#</th><th>Date</th><th>Serial</th><th>Tool</th><th>Used?</th><th>Routed To</th></tr></thead>
          <tbody>${g.hist.flatMap(rb=>rb.toolLines.map((tl,i)=>`<tr>
            ${i===0?`<td rowspan="${rb.toolLines.length}" style="font-family:monospace;font-weight:700;color:var(--grn-d)">${esc(rb.rtNumber)}</td><td rowspan="${rb.toolLines.length}" style="font-size:11px">${fd(rb.rtDate)}</td>`:''}
            <td>${sn(tl.serial,tl.serial.startsWith('EMD-'))}</td>
            <td style="font-weight:500">${esc(tl.shortDesc)}</td>
            <td>${tl.used?`<span style="color:var(--amber-d);font-weight:600;font-size:11px">Used</span>`:`<span style="color:var(--grn);font-weight:600;font-size:11px">Not Used</span>`}</td>
            <td style="font-size:11px;color:var(--s500)">${esc(tl.routedTo)}</td>
          </tr>`)).join('')}</tbody>
        </table></div>`:''}
      </div>
    </div>`;
  }).join('');
}

  const allRigs=buildRTGroups();

function retAll(cb,gid){document.querySelectorAll(`.ret-ck[data-gid="${gid}"]`).forEach(b=>b.checked=cb.checked);}
function setRU(serial,val){
  RU[serial]=val;const sid=encodeURIComponent(serial);
  const y=document.getElementById('ry-'+sid);const n=document.getElementById('rn-'+sid);
  const on='background:var(--amber-l);border:1.5px solid var(--amber);color:var(--amber-d);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:inherit';
  const gn='background:var(--grn-l);border:1.5px solid var(--grn);color:var(--grn-d);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:inherit';
  if(y)y.style.cssText=val?on:'';if(n)n.style.cssText=!val?gn:'';
}

function mCreateRT(gkeyEnc){
  const checked=[...document.querySelectorAll(`.ret-ck[data-gid="${gkeyEnc}"]:checked`)];
  if(!checked.length){toast('Tick tools to return first','wrn');return;}
  const tools=checked.map(b=>({serial:b.dataset.ser,dtBatchId:b.dataset.dtb,jobId:b.dataset.job,used:RU[b.dataset.ser]??null}));
  const kp=decodeURIComponent(gkeyEnc).split('|||');
  const rig=kp[0],well=kp[1],contract=kp[2];
  const isAON=contract.toUpperCase().includes('ONSHORE');
  const rows=tools.map(t=>`<tr><td>${sn(t.serial,t.serial.startsWith('EMD-'))}</td><td>${
    t.used===true?`<span style="color:var(--amber-d);font-weight:600">Used ✓</span>`:
    t.used===false?`<span style="color:var(--grn-d);font-weight:600">Not Used ✓</span>`:
    `<span style="color:var(--red);font-size:11px">⚠ Not set — go back and mark Used/Not Used</span>`
  }</td></tr>`).join('');
  modal(`<div class="modal-ov" id="m-crt">
    <div class="modal modal-lg">
      <div class="modal-hdr">
        <div><div class="modal-title">Create Receiving Ticket</div><div class="modal-sub">${esc(rig)} / ${esc(well)} — ${tools.length} tools</div></div>
        <button class="modal-close" onclick="closeModal('m-crt')">✕</button>

function confirmRT(){
  const rtNum=(document.getElementById('rt-num')||{}).value||nxtRT();
  if(state.rtBatches.some(b=>normStr(b.rtNumber).toLowerCase()===normStr(rtNum).toLowerCase())){
    toast(`RT Number "${rtNum}" is already used by another batch — enter a unique number`,'err');return;
  }
  const rtDate=(document.getElementById('rt-dt')||{}).value||TODAY;
  const rmDate=(document.getElementById('rt-rm')||{}).value||rtDate;
  const cond=(document.getElementById('rt-cond')||{}).value||'';
  const tools=window._rtT||[];const grp=window._rtG||{};
  if(!tools.length)return;
  const unset=tools.filter(t=>t.used===null||t.used===undefined);
  if(unset.length){toast('Set Used/Not Used for all tools first','err');return;}
  const lines=tools.map(t=>{
    const inv=state.inventory.find(x=>x.serial===t.serial);
    return{serial:t.serial,assetNo:inv?inv.assetNo:t.serial,shortDesc:inv?inv.shortDesc:'',dtBatchId:t.dtBatchId,used:t.used,routedTo:t.used?'Inspection Bay':'Emdad Base',condition:cond};
  });
  const rb={id:'RTB-'+Date.now(),rtNumber:rtNum,jobId:(tools[0]||{}).jobId||'',rtDate,backloadRmDate:grp.isAON?rmDate:rtDate,contract:grp.contract,rig:grp.rig,well:grp.well,receivedBy:CU.name,toolLines:lines};
  state.rtBatches.push(rb);
  const touchedDTBatches=new Set();
  tools.forEach(t=>{
    state.dtBatches.forEach(b=>{const tl=b.toolLines.find(x=>x.serial===t.serial&&x.status==='OnRig');if(tl){tl.status='Returned';tl.rtBatchId=rb.id;tl.used=t.used;touchedDTBatches.add(b);}});
    const inv=state.inventory.find(x=>x.serial===t.serial);
    if(inv){inv.location=t.used?'Inspection Bay':'Emdad Base';inv.status=t.used?'Inspection':'Good';if(!t.used){inv.rig='';inv.well='';inv.contract='';}apiUpdateTool(inv);}
    logMov(t.serial,'RT Return','On Rig',t.used?'Inspection Bay':'Emdad Base',rtNum);
    if(t.used){
      const insRec={id:nxtINS(),woNumber:nxtWOI(),serial:t.serial,assetNo:inv?inv.assetNo:'',shortDesc:inv?inv.shortDesc:'',size:inv?inv.size:'',fromRtId:rb.id,rtNumber:rtNum,receivedDate:rtDate,inspector:'',inspectionDate:null,status:'Pending',reportNumber:'',disposition:'',notes:''};
      state.inspections.push(insRec);
      apiSaveInspection(insRec);
    }
  });
  toast(`RT ${rtNum} — ${tools.length} tools received`,'ok');closeModal('m-crt');RU={};
  apiSaveRTBatch(rb);
  touchedDTBatches.forEach(b=>apiSaveDTBatch(b));
  save();renderModule('returns');
}

  ins.notes=document.getElementById('ii-nt').value;
  const t=state.inventory.find(x=>x.serial===ins.serial);

    else if(ins.status==='Fail'){

      apiSaveMaintenance(mntRec);

}

function confirmMnt(mntId){
  const m=state.maintenance.find(x=>x.id===mntId);if(!m)return;
  m.type=document.getElementById('mn-tp').value;
  m.vendor=document.getElementById('mn-vnd').value;
  m.assignedTo=document.getElementById('mn-asg').value;
  m.estCompleteDate=document.getElementById('mn-est').value;
  m.status=document.getElementById('mn-st').value;
  m.cost=parseFloat(document.getElementById('mn-cst').value)||null;
  m.notes=document.getElementById('mn-nt').value;
  save();toast('Work order updated','ok');closeModal('m-mnt');renderModule('maintenance');
  apiSaveMaintenance(m);
}
function closeMnt(mntId){
  const m=state.maintenance.find(x=>x.id===mntId);if(!m)return;
  // Critical safety check: never let a tool flip to "Good/Available" while
  // it still has ANOTHER active work order open. Without this, a tool can
  // show as available in Inventory while genuinely still mid-repair under a
  // different WO — exactly the kind of mismatch that could get a tool
  // dispatched while it's still sitting in the workshop.
  const otherActive=state.maintenance.find(x=>x.id!==m.id&&x.serial===m.serial&&['In Progress','Awaiting Parts'].includes(x.status));
  if(otherActive){
    toast(`Cannot move to base — ${otherActive.woNumber} for this same tool is still ${otherActive.status}. Resolve that work order first.`,'err');
    return;
  }
  if(!confirm('Mark complete and return to Emdad Base as Good?'))return;
  m.status='Closed';m.completedDate=TODAY;
  const t=state.inventory.find(x=>x.serial===m.serial);
  if(t){t.status='Good';t.location='Emdad Base';t.rig='';t.well='';t.contract='';apiUpdateTool(t);}
  logMov(m.serial,'Maintenance Complete','Workshop','Emdad Base',m.woNumber);
  save();toast(m.serial+' returned to base as Good','ok');renderModule('maintenance');
  apiSaveMaintenance(m);
}

function confirmAddMnt(){
  const ser=document.getElementById('am-ser').value.trim();

  if(!ser||!iss){toast('Serial and issue required','err');return;}
  const t=state.inventory.find(x=>x.serial===ser);
  const mntRec={id:nxtMNT(),woNumber:nxtWOM(),serial:ser,assetNo:t?t.assetNo:'',shortDesc:t?t.shortDesc:'',size:t?t.size:'',fromInspectionId:null,issue:iss,type:document.getElementById('am-tp').value,vendor:'',assignedTo:'',startDate:TODAY,estCompleteDate:null,completedDate:null,status:document.getElementById('am-st').value,cost:null,notes:document.getElementById('am-nt').value};

function fmtMoney(n){return n===null||n===undefined||n===''?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pbgUrgency(dateStr){
  if(!dateStr)return{label:'—',color:'var(--s400)',bg:'transparent'};
  const days=Math.ceil((new Date(dateStr)-new Date(TODAY))/86400000);
  if(days<0)return{label:fd(dateStr)+' (EXPIRED)',color:'#fff',bg:'var(--red)'};
  if(days<=30)return{label:fd(dateStr)+` (${days}d)`,color:'#fff',bg:'var(--red)'};
  if(days<=60)return{label:fd(dateStr)+` (${days}d)`,color:'#7c2d12',bg:'#fed7aa'};
  if(days<=90)return{label:fd(dateStr)+` (${days}d)`,color:'#854d0e',bg:'#fef9c3'};
  return{label:fd(dateStr),color:'var(--grn-d)',bg:'#f0fdf4'};
}
function pageContracts(){
  const cons=state.contracts;
  const q=(CONQ||'').toLowerCase();
  const stF=CONST_||'';
  const fil=cons.filter(c=>{
    if(stF&&c.status!==stF)return false;
    if(q&&![c.client,c.contractRef,c.poNumber].join(' ').toLowerCase().includes(q))return false;
    return true;
  });
  const active=cons.filter(c=>c.status==='Active').length;
  const completed=cons.filter(c=>c.status==='Completed').length;
  const pbgByCur={};
  cons.forEach(c=>{if(c.pbgValue){pbgByCur[c.currency]=(pbgByCur[c.currency]||0)+Number(c.pbgValue);}});
  const pbgTotalStr=Object.keys(pbgByCur).length?Object.entries(pbgByCur).map(([cur,v])=>`${fmtMoney(v)} ${cur}`).join(' + '):'—';
  const expiringSoon=cons.filter(c=>{
    if(!c.pbgExpiryDate)return false;
    const days=Math.ceil((new Date(c.pbgExpiryDate)-new Date(TODAY))/86400000);
    return days<=60;
  }).length;

  return `
  <div class="page-hdr">
    <div class="page-hdr-l"><div class="page-bc">Accounts</div><div class="page-title">Contracts</div></div>
    <div class="page-hdr-r">${canWrite('contracts')?`<button class="btn btn-primary" onclick="mNewContract()">+ Add Contract</button>`:''}</div>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
    ${sc('📋',active,'Active Contracts','#f0fdf4','var(--grn)')}
    ${sc('✅',completed,'Completed','var(--s100)','var(--s500)')}
    ${sc('🏦',pbgTotalStr,'Total PBG Value','#eff6ff','var(--blue)')}
    ${sc(expiringSoon?'⚠️':'✅',expiringSoon,'PBG Expiring ≤60 Days',expiringSoon?'#fef2f2':'#f0fdf4',expiringSoon?'var(--red)':'var(--grn)')}
  </div>
  ${state.contracts.every(c=>!c.contractValue&&!c.pbgValue)?alert_('amber','📋','No contract values or PBG details entered yet — click Edit on a contract (or + Add Contract) to fill them in once you have the data.'):''}
  <div class="card" style="padding:12px 16px;margin-bottom:14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="inp inp-sm" placeholder="🔍 Search client, contract ref, PO..." value="${esc(CONQ||'')}" oninput="CONQ=this.value;renderModule('contracts')" style="width:280px">
      <select class="inp inp-sm" onchange="CONST_=this.value;renderModule('contracts')" style="width:150px">
        <option value="">All Status</option>
        ${['Active','Completed','Expired'].map(s=>`<option ${stF===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--s400);margin-left:auto">${fil.length} of ${cons.length} contracts</span>
    </div>
  </div>
  <div class="tbl-wrap"><table class="tbl tbl-xs">
    <thead><tr>
      <th>Client</th><th>Contract Ref</th><th>Status</th><th>Currency</th>
      <th style="text-align:right">Contract Value</th><th style="text-align:right">Invoiced to Date</th>
      <th style="text-align:right">Balance</th><th>% Consumed</th>
      <th style="text-align:right">PBG Value</th><th>PBG Expiry</th>
      ${canWrite('contracts')?'<th>Actions</th>':''}
    </tr></thead>
    <tbody>${fil.map(c=>{
      const hasInvoice=c.invoicedToDate!==null&&c.invoicedToDate!==undefined&&c.invoicedToDate!=='';
      const balance=hasInvoice&&c.contractValue?Number(c.contractValue)-Number(c.invoicedToDate):null;
      const pct=hasInvoice&&c.contractValue?Math.min(100,Math.round(Number(c.invoicedToDate)/Number(c.contractValue)*100)):null;
      const urg=pbgUrgency(c.pbgExpiryDate);
      return `<tr>
        <td style="font-weight:600">${esc(c.client)}</td>
        <td style="font-family:monospace;font-size:11px">${esc(c.contractRef)}</td>
        <td>${sb(c.status)}</td>
        <td>${esc(c.currency)}</td>
        <td style="text-align:right">${fmtMoney(c.contractValue)}</td>
        <td style="text-align:right;color:${hasInvoice?'inherit':'var(--s400)'}">${hasInvoice?fmtMoney(c.invoicedToDate):'Not yet invoiced'}</td>
        <td style="text-align:right;font-weight:600">${balance===null?'—':fmtMoney(balance)}</td>
        <td>${pct===null?'<span style="color:var(--s400);font-size:11px">—</span>':`
          <div style="display:flex;align-items:center;gap:6px">
            <div style="flex:1;height:6px;background:var(--s100);border-radius:3px;overflow:hidden;min-width:50px">
              <div style="width:${pct}%;height:100%;background:${pct>=90?'var(--red)':pct>=70?'#f59e0b':'var(--grn)'}"></div>
            </div><span style="font-size:10.5px;color:var(--s500)">${pct}%</span>
          </div>`}</td>
        <td style="text-align:right">${fmtMoney(c.pbgValue)}</td>
        <td><span style="font-size:11px;padding:2px 7px;border-radius:10px;background:${urg.bg};color:${urg.color};font-weight:600;white-space:nowrap">${urg.label}</span></td>
        ${canWrite('contracts')?`<td><button class="btn btn-secondary btn-xs" onclick="mEditContract('${esc(c.id)}')">Edit</button></td>`:''}
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  ${!fil.length?`<div class="empty"><div class="empty-ico">📋</div><div class="empty-title">No contracts found</div></div>`:''}`;
}

let TAB_PL='client';

function pagePriceLists(){
  if(PL_CLIENT_RATES===null || PL_SUB_RATES===null){

    // then re-render once real data arrives -- renderModule's dispatch
    // is synchronous, so this page can't be an async function itself.
    Promise.all([
      PL_CLIENT_RATES===null ? API('getcontractratesfull').catch(()=>[]) : Promise.resolve(PL_CLIENT_RATES),
      PL_SUB_RATES===null ? API('getsubcontractrates').catch(()=>[]) : Promise.resolve(PL_SUB_RATES)
    ]).then(([cr,sr])=>{

      if(CURRENT_MODULE==='pricelists')renderModule('pricelists');

  }

  const q=(PLQ||'').toLowerCase();
  const clientFil=(PL_CLIENT_RATES||[]).filter(r=>!q||[r.ContractCode,r.Category,r.HoleSection,r.EMDADShortDesc].join(' ').toLowerCase().includes(q));

      <button class="mod-tab${TAB_PL==='client'?' active':''}" onclick="TAB_PL='client';renderModule('pricelists')">Client Contract Rates (${(PL_CLIENT_RATES||[]).length})</button>
      <button class="mod-tab${TAB_PL==='sub'?' active':''}" onclick="TAB_PL='sub';renderModule('pricelists')">Sub-Contractor Rates (${(PL_SUB_RATES||[]).length})</button>
    </div>
  </div>
  <div class="card" style="padding:12px 16px;margin-bottom:14px">

async function doLoginUI(){
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  const errEl = document.getElementById('lerr');
  const btn = document.querySelector('.login-wrap .btn-primary');
  
  if(!u || !p){
    errEl.textContent = 'Please enter username and password';
    errEl.style.display = '';
    return;
  }

  const user = USERS.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pass === p);
  if(!user){
    errEl.textContent = 'Invalid username or password';
    errEl.style.display = '';
    return;
  }

  errEl.style.display = 'none';
  if(btn){ btn.textContent = 'Signing in...'; btn.disabled = true; }

  CU = user;
  sessionStorage.setItem(SK.usr, JSON.stringify({id: user.id, username: user.username}));

  // Instant UI transition to dashboard (Zero Lag)
  const loginPage = document.getElementById('login-page');
  if(loginPage) loginPage.style.display = 'none';
  
  const appContainer = document.getElementById('app');
  if(appContainer) appContainer.style.display = 'flex';

  renderSidebar();
  renderModule('dashboard');

  const localUser = doLogin(u, p);
  if(localUser){
    errEl.style.display = 'none';
    initApp();
    if(btn){ btn.textContent = 'Sign In →'; btn.disabled = false; }
    API('login', {username: u, password: p}).then(apiUser => {
      if(apiUser) CU = {id: apiUser.id, username: apiUser.username, name: apiUser.name, role: apiUser.role};
    }).catch(() => {});
    return;
  }

  if(btn){ btn.textContent = 'Signing in...'; btn.disabled = true; }
  try{
    const apiUser = await API('login', {username: u, password: p});
    if(apiUser){
      CU = {id: apiUser.id, username: apiUser.username, name: apiUser.name, role: apiUser.role};
      sessionStorage.setItem(SK.usr, JSON.stringify({id: CU.id, username: CU.username}));
      errEl.style.display = 'none';
      initApp();
      return;
    }
  } catch(e){}
  
  errEl.textContent = 'Invalid username or password';
  errEl.style.display = '';
  if(btn){ btn.textContent = 'Sign In →'; btn.disabled = false; }
}

function showLogin(){
  const lp=document.getElementById('login-page');
  const app=document.getElementById('app');
  if(lp)lp.style.display='';
  if(app)app.style.display='none';
}
window.doLoginUI = doLoginUI;


function initApp(){
  if(!CU){console.error('initApp: no CU');return;}
  load();
  document.getElementById('login-page').style.display = 'none';
  const jobHubId = new URLSearchParams(location.search).get('jobHub');
  if(jobHubId){
    document.getElementById('app').style.display = 'none';
    document.getElementById('job-hub-root').style.display = '';
    renderJobHubFullPage(jobHubId);
    return;
  }
  document.getElementById('app').style.display = '';
  renderSidebar();
  const d = document.getElementById('tb-date'); if(d) d.textContent = fdL(TODAY);
  const mod = getModule();
  renderModule(canAccess(mod) ? mod : 'dashboard');
}

(function boot(){
  if(checkAuth() && CU) initApp();
})();
